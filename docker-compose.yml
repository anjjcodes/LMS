services:
  postgres:
    image: postgres:16-alpine
    container_name: lms-postgres
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
      POSTGRES_DB: lms
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - lms-pgdata:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  lms-pgdata:
